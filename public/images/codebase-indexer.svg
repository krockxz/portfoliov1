<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ce422b"/>
      <stop offset="100%" style="stop-color:#e76f51"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Terminal window -->
  <g transform="translate(60, 50)">
    <!-- Terminal chrome -->
    <rect x="0" y="0" width="1080" height="42" rx="8" ry="8" fill="#1e1e2e"/>
    <rect x="0" y="36" width="1080" height="6" fill="#1e1e2e"/>
    <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="21" r="6" fill="#febc2e"/>
    <circle cx="64" cy="21" r="6" fill="#28c840"/>
    <text x="540" y="26" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="13">codebase-indexer</text>

    <!-- Terminal body -->
    <rect x="0" y="42" width="1080" height="508" fill="#11111b"/>

    <!-- Terminal content -->
    <g font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="14" fill="#a6e3a1">
      <!-- Command -->
      <text x="20" y="75" fill="#89b4fa">$</text>
      <text x="40" y="75" fill="#cba6f7">cargo run -- index ./my-project</text>

      <!-- Indexing output -->
      <text x="20" y="110" fill="#a6e3a1">  Walking codebase...</text>
      <text x="20" y="132" fill="#a6e3a1">  Chunking with tree-sitter (7 langs)...</text>

      <!-- Progress animation -->
      <text x="20" y="154" fill="#f9e2af">  Embedding chunks ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓░░░ 94% (nomic-embed INT8)</text>

      <!-- Indexing stats -->
      <text x="20" y="190" fill="#a6e3a1">  BM25 index built...</text>
      <text x="20" y="212" fill="#a6e3a1">  Vector store committed (HNSW, 2,847 vectors)</text>
      <text x="20" y="248" fill="#89dceb">  ✓ Indexed 1,247 files → 2,847 chunks in 3.2s</text>

      <!-- Separator -->
      <text x="20" y="282" fill="#585b70">────────────────────────────────────────────────────</text>

      <!-- Search -->
      <text x="20" y="310" fill="#89b4fa">$</text>
      <text x="40" y="310" fill="#cba6f7">codebase-indexer query "cosine similarity" ./my-project</text>

      <!-- Results header -->
      <text x="20" y="344" fill="#f9e2af">  ┌─ Results (hybrid BM25 + vector, RRF k=60) ──────────┐</text>

      <!-- Result 1 -->
      <text x="20" y="370" fill="#585b70">  │</text>
      <text x="30" y="370" fill="#89b4fa" font-weight="bold">1.</text>
      <text x="50" y="370" fill="#cdd6f4">src/embeddings.rs:142-167</text>
      <text x="340" y="370" fill="#585b70">│ score:</text>
      <text x="400" y="370" fill="#a6e3a1">0.89</text>
      <text x="440" y="370" fill="#585b70">│</text>
      <text x="20" y="388" fill="#585b70">  │</text>
      <text x="30" y="388" fill="#6c7086">    fn cosine_similarity(a: &amp;[f32], b: &amp;[f32]) -&gt; f32 {</text>

      <!-- Result 2 -->
      <text x="20" y="416" fill="#585b70">  │</text>
      <text x="30" y="416" fill="#89b4fa" font-weight="bold">2.</text>
      <text x="50" y="416" fill="#cdd6f4">src/vector_store.rs:58-83</text>
      <text x="340" y="416" fill="#585b70">│ score:</text>
      <text x="400" y="416" fill="#a6e3a1">0.82</text>
      <text x="440" y="416" fill="#585b70">│</text>
      <text x="20" y="434" fill="#585b70">  │</text>
      <text x="30" y="434" fill="#6c7086">    pub fn search(&amp;self, query: Vec&lt;f32&gt;, k: usize) -&gt; Vec&lt;Hit&gt; {</text>

      <!-- Result 3 -->
      <text x="20" y="462" fill="#585b70">  │</text>
      <text x="30" y="462" fill="#89b4fa" font-weight="bold">3.</text>
      <text x="50" y="462" fill="#cdd6f4">src/chunker.rs:201-225</text>
      <text x="340" y="462" fill="#585b70">│ score:</text>
      <text x="400" y="462" fill="#a6e3a1">0.74</text>
      <text x="440" y="462" fill="#585b70">│</text>
      <text x="20" y="480" fill="#585b70">  │</text>
      <text x="30" y="480" fill="#6c7086">    /// Chunks source files using tree-sitter AST parsing</text>

      <!-- Footer -->
      <text x="20" y="514" fill="#585b70">  └───────────────────────────────────────────────────────┘</text>
    </g>
  </g>

  <!-- Bottom info bar -->
  <g transform="translate(0, 590)">
    <rect x="0" y="0" width="1200" height="85" fill="#11111b" opacity="0.9"/>

    <!-- Merkle tree icon (simplified) -->
    <g transform="translate(60, 12)">
      <circle cx="30" cy="16" r="8" fill="none" stroke="#ce422b" stroke-width="2" filter="url(#glow)"/>
      <circle cx="14" cy="46" r="6" fill="none" stroke="#e76f51" stroke-width="1.5"/>
      <circle cx="46" cy="46" r="6" fill="none" stroke="#e76f51" stroke-width="1.5"/>
      <circle cx="6" cy="68" r="4" fill="#89b4fa" opacity="0.7"/>
      <circle cx="22" cy="68" r="4" fill="#89b4fa" opacity="0.7"/>
      <circle cx="38" cy="68" r="4" fill="#a6e3a1" opacity="0.7"/>
      <circle cx="54" cy="68" r="4" fill="#a6e3a1" opacity="0.7"/>
      <line x1="30" y1="24" x2="14" y2="40" stroke="#585b70" stroke-width="1"/>
      <line x1="30" y1="24" x2="46" y2="40" stroke="#585b70" stroke-width="1"/>
      <line x1="14" y1="52" x2="6" y2="64" stroke="#585b70" stroke-width="0.5"/>
      <line x1="14" y1="52" x2="22" y2="64" stroke="#585b70" stroke-width="0.5"/>
      <line x1="46" y1="52" x2="38" y2="64" stroke="#585b70" stroke-width="0.5"/>
      <line x1="46" y1="52" x2="54" y2="64" stroke="#585b70" stroke-width="0.5"/>
    </g>

    <!-- Project title -->
    <text x="140" y="40" fill="#cdd6f4" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="700">codebase-indexer</text>
    <text x="140" y="62" fill="#a6adc8" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="400">Offline semantic code search · Hybrid BM25 + vector · Merkle-tree delta detection</text>

    <!-- Tech tags -->
    <g transform="translate(820, 25)">
      <rect x="0" y="0" width="70" height="26" rx="4" fill="#1e1e2e" stroke="#ce422b" stroke-width="1"/>
      <text x="35" y="17" text-anchor="middle" fill="#ce422b" font-family="monospace" font-size="11" font-weight="700">Rust</text>

      <rect x="80" y="0" width="90" height="26" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="125" y="17" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11" font-weight="500">tree-sitter</text>

      <rect x="180" y="0" width="65" height="26" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
      <text x="212" y="17" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="500">ONNX</text>

      <rect x="255" y="0" width="80" height="26" rx="4" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1"/>
      <text x="295" y="17" text-anchor="middle" fill="#cba6f7" font-family="monospace" font-size="11" font-weight="500">Tantivy</text>
    </g>
  </g>

  <!-- Cursor blink -->
  <rect x="830" y="293" width="8" height="16" fill="#cba6f7" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>